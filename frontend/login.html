<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shopinza - Sign In</title>

<link href="https://fonts.googleapis.com" rel="preconnect" />
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="dark.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="auth-shell">

    <div class="auth-image-side">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCsczLwAfpiSAAL8rwF36kyEC0VEb169H47rkxmZPpqET5Wb7hzhOceHk8VM3Y80U2PqdnEvlQ--e4nNaWeVGUAAY-MkLR_bPQYk6c7e8U0oNGtSUX9HgDxJKcRAJE3pjm_NwmyBQyztvsj9qfkrv949pw6tNqq1bSnLj4yg_ss8_QhJnUqHvFfOmjKWmoa9wws5k1WbHSI7hiKcRz2INLYhSlZ5z7_ciabtea-5U3vyN-jUcSwTpOOIA" alt="Shopina lifestyle" />
        <span class="auth-brand-floating logo-chip"><img src="assets/images/logo.png" alt="Shopinza" style="height:22px;width:auto;display:block;" /></span>
    </div>

    <div class="auth-form-side">
        <div class="auth-form-container">

            <h1 id="page-title">Welcome back</h1>
            <p id="page-subtitle">Enter your credentials to access your curated collection.</p>

            <!-- LOGIN FORM -->
            <form id="form-login">
                <div class="auth-field">
                    <label for="login-email">Email Address</label>
                    <div class="input-icon-wrap">
                        <span class="material-symbols-outlined">mail</span>
                        <input id="login-email" type="email" placeholder="name@example.com" required />
                    </div>
                </div>
                <div class="auth-field">
                    <div class="auth-field-row">
                        <label for="login-password">Password</label>
                        <a href="forgot-password.html" class="a">Forgot password?</a>
                    </div>
                    <div class="input-icon-wrap">
                        <span class="material-symbols-outlined">lock</span>
                        <input id="login-password" type="password" placeholder="••••••••" required minlength="8" />
                    </div>
                </div>
                <p id="login-feedback" class="auth-hint hidden"></p>
                <button class="auth-submit" type="submit">Sign In <span class="material-symbols-outlined" style="font-size:18px">arrow_forward</span></button>
            </form>

            <!-- SIGN UP FORM (hidden by default) -->
            <form id="form-signup" class="hidden">
                <div class="form-row">
                    <div class="auth-field">
                        <label for="signup-fname">First Name</label>
                        <input id="signup-fname" type="text" placeholder="Jane" required style="background-color:#1e222e;border:1px solid #262a37;border-radius:8px;padding:12px 14px;color:#f5f5f7;" />
                    </div>
                    <div class="auth-field">
                        <label for="signup-lname">Last Name</label>
                        <input id="signup-lname" type="text" placeholder="Doe" required style="background-color:#1e222e;border:1px solid #262a37;border-radius:8px;padding:12px 14px;color:#f5f5f7;" />
                    </div>
                </div>
                <div class="auth-field">
                    <label for="signup-email">Email Address</label>
                    <div class="input-icon-wrap">
                        <span class="material-symbols-outlined">mail</span>
                        <input id="signup-email" type="email" placeholder="name@example.com" required />
                    </div>
                </div>
                <div class="auth-field">
                    <label for="signup-password">Password</label>
                    <div class="input-icon-wrap">
                        <span class="material-symbols-outlined">lock</span>
                        <input id="signup-password" type="password" placeholder="Create a strong password" required minlength="8" />
                    </div>
                    <p class="auth-hint">Must be at least 8 characters with a number and symbol.</p>
                </div>
                <p id="signup-feedback" class="auth-hint hidden"></p>
                <button class="auth-submit" type="submit">Create Account</button>
                <p class="auth-terms">By creating an account, you agree to our <a href="terms-of-service.html">Terms of Service</a> and <a href="privacy-policy.html">Privacy Policy</a>.</p>
            </form>

            <div class="auth-divider">or continue with</div>

            <div class="social-buttons">
                <div id="google-signin-container" style="display:flex; justify-content:center;"></div>
                <button class="social-btn" type="button" id="facebook-signin-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"/></svg>
                    Facebook
                </button>
            </div>

            <div class="auth-toggle">
                <span id="toggle-text">Don't have an account?</span>
                <button id="toggle-form-btn" type="button">Sign Up</button>
            </div>

        </div>
    </div>

</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
