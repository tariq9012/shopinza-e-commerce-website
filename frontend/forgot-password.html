<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shopinza - Forgot Password</title>

<link href="https://fonts.googleapis.com" rel="preconnect" />
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="dark.css" />
</head>
<body>

<div class="auth-shell">

    <div class="auth-image-side">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCsczLwAfpiSAAL8rwF36kyEC0VEb169H47rkxmZPpqET5Wb7hzhOceHk8VM3Y80U2PqdnEvlQ--e4nNaWeVGUAAY-MkLR_bPQYk6c7e8U0oNGtSUX9HgDxJKcRAJE3pjm_NwmyBQyztvsj9qfkrv949pw6tNqq1bSnLj4yg_ss8_QhJnUqHvFfOmjKWmoa9wws5k1WbHSI7hiKcRz2INLYhSlZ5z7_ciabtea-5U3vyN-jUcSwTpOOIA" alt="Shopina lifestyle" />
        <span class="auth-brand-floating logo-chip"><img src="assets/images/logo.png" alt="Shopinza" style="height:22px;width:auto;display:block;" /></span>
    </div>

    <div class="auth-form-side">
        <div class="auth-form-container">

            <h1>Forgot your password?</h1>
            <p>Enter the email address on your account and we'll send you a link to reset your password.</p>

            <form id="form-forgot-password">
                <div class="auth-field">
                    <label for="forgot-email">Email Address</label>
                    <div class="input-icon-wrap">
                        <span class="material-symbols-outlined">mail</span>
                        <input id="forgot-email" type="email" placeholder="name@example.com" required />
                    </div>
                </div>
                <p id="forgot-feedback" class="auth-hint hidden"></p>
                <button class="auth-submit" type="submit">Send Reset Link <span class="material-symbols-outlined" style="font-size:18px">arrow_forward</span></button>
            </form>

            <div class="auth-toggle">
                <span>Remembered your password?</span>
                <a href="login.html" style="color:#f5f5f7; font-weight:600; margin-left:6px;">Sign In</a>
            </div>

        </div>
    </div>

</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
