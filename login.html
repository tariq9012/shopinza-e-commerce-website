<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shopina - Sign In</title>

<link href="https://fonts.googleapis.com" rel="preconnect" />
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="dark.css" />
</head>
<body>

<div class="auth-shell">

    <div class="auth-image-side">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCsczLwAfpiSAAL8rwF36kyEC0VEb169H47rkxmZPpqET5Wb7hzhOceHk8VM3Y80U2PqdnEvlQ--e4nNaWeVGUAAY-MkLR_bPQYk6c7e8U0oNGtSUX9HgDxJKcRAJE3pjm_NwmyBQyztvsj9qfkrv949pw6tNqq1bSnLj4yg_ss8_QhJnUqHvFfOmjKWmoa9wws5k1WbHSI7hiKcRz2INLYhSlZ5z7_ciabtea-5U3vyN-jUcSwTpOOIA" alt="Shopina lifestyle" />
        <span class="auth-brand-floating">Shopina</span>
    </div>

    <div class="auth-form-side">
        <div class="auth-form-container">

            <h1 id="page-title">Welcome back</h1>
            <p id="page-subtitle">Enter your credentials to access your curated collection.</p>

            <!-- LOGIN FORM -->
            <form id="form-login" onsubmit="event.preventDefault();">
                <div class="auth-field">
                    <label for="login-email">Email Address</label>
                    <div class="input-icon-wrap">
                        <span class="material-symbols-outlined">mail</span>
                        <input id="login-email" type="email" placeholder="name@example.com" />
                    </div>
                </div>
                <div class="auth-field">
                    <div class="auth-field-row">
                        <label for="login-password">Password</label>
                        <a href="#" class="a">Forgot password?</a>
                    </div>
                    <div class="input-icon-wrap">
                        <span class="material-symbols-outlined">lock</span>
                        <input id="login-password" type="password" placeholder="••••••••" />
                    </div>
                </div>
                <button class="auth-submit" type="submit">Sign In <span class="material-symbols-outlined" style="font-size:18px">arrow_forward</span></button>
            </form>

            <!-- SIGN UP FORM (hidden by default) -->
            <form id="form-signup" class="hidden" onsubmit="event.preventDefault();">
                <div class="form-row">
                    <div class="auth-field">
                        <label for="signup-fname">First Name</label>
                        <input id="signup-fname" type="text" placeholder="Jane" style="background-color:#1e222e;border:1px solid #262a37;border-radius:8px;padding:12px 14px;color:#f5f5f7;" />
                    </div>
                    <div class="auth-field">
                        <label for="signup-lname">Last Name</label>
                        <input id="signup-lname" type="text" placeholder="Doe" style="background-color:#1e222e;border:1px solid #262a37;border-radius:8px;padding:12px 14px;color:#f5f5f7;" />
                    </div>
                </div>
                <div class="auth-field">
                    <label for="signup-email">Email Address</label>
                    <div class="input-icon-wrap">
                        <span class="material-symbols-outlined">mail</span>
                        <input id="signup-email" type="email" placeholder="name@example.com" />
                    </div>
                </div>
                <div class="auth-field">
                    <label for="signup-password">Password</label>
                    <div class="input-icon-wrap">
                        <span class="material-symbols-outlined">lock</span>
                        <input id="signup-password" type="password" placeholder="Create a strong password" />
                    </div>
                    <p class="auth-hint">Must be at least 8 characters with a number and symbol.</p>
                </div>
                <button class="auth-submit" type="submit">Create Account</button>
                <p class="auth-terms">By creating an account, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
            </form>

            <div class="auth-divider">or continue with</div>

            <div class="social-buttons">
                <button class="social-btn" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Google
                </button>
                <button class="social-btn" type="button">
                    <span class="material-symbols-outlined" style="font-size:18px">file_download</span>
                    Apple
                </button>
            </div>

            <div class="auth-toggle">
                <span id="toggle-text">Don't have an account?</span>
                <button id="toggle-form-btn" type="button">Sign Up</button>
            </div>

        </div>
    </div>

</div>

<script>
    const toggleBtn = document.getElementById('toggle-form-btn');
    const toggleText = document.getElementById('toggle-text');
    const loginForm = document.getElementById('form-login');
    const signupForm = document.getElementById('form-signup');
    const pageTitle = document.getElementById('page-title');
    const pageSubtitle = document.getElementById('page-subtitle');

    let isLogin = true;

    toggleBtn.addEventListener('click', () => {
        isLogin = !isLogin;

        if (isLogin) {
            pageTitle.textContent = "Welcome back";
            pageSubtitle.textContent = "Enter your credentials to access your curated collection.";
            toggleText.textContent = "Don't have an account?";
            toggleBtn.textContent = "Sign Up";
            signupForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
        } else {
            pageTitle.textContent = "Join Shopina";
            pageSubtitle.textContent = "Create an account to elevate your luxury experience.";
            toggleText.textContent = "Already have an account?";
            toggleBtn.textContent = "Sign In";
            loginForm.classList.add('hidden');
            signupForm.classList.remove('hidden');
        }
    });
</script>

</body>
</html>
